[project]
name = "codecast"
version = "0.1.0"
description = "Turn a GitLab merge request into a steerable two-voice podcast review."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=12.3.0",
]

[project.scripts]
codecast = "codecast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codecast"]
